spring.application.name=Ace-Front-Line-Security-Solutions

server.port=8080
#Database
spring.datasource.url=jdbc:mysql://localhost:3306/security_db?allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username=root
spring.datasource.password=2004Ruhansi@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
app.jwt.secret=AceFrontLineSecuritySolutionsSecretKeyForJWTTokenGenerationMustBe256BitsLong
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
# Mail (configure with your SMTP provider)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads/photos

# OTP Expiry (minutes)
app.otp.expiry-minutes=10

# CORS
app.cors.allowed-origins=http://localhost:3000
# Logging
logging.level.com.security.Ace=DEBUG

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.security.user.name=admin
spring.security.user.password=123

