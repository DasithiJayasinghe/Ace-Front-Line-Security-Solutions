spring.application.name=Ace-Front-Line-Security-Solutions

server.port=8080
#Database in root
spring.datasource.url=jdbc:mysql://localhost:3306/security_db?allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username=root
spring.datasource.password=2004Ruhansi@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
app.jwt.secret=AceFrontLineSecuritySolutionsSecretKeyForJWTTokenGenerationMustBe256BitsLong
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
# Mail (configure with your SMTP provider)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Disable mail sending locally to avoid SMTP auth failures with placeholder creds
app.mail.enabled=false
# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=./uploads/photos

# OTP Expiry (minutes)
app.otp.expiry-minutes=10

# CORS - include multiple ports for Vite's dynamic port assignment
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,http://127.0.0.1:5173
# Logging
logging.level.com.security.Ace=DEBUG

# Jackson - serialize dates as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Removed: hibernate.dialect is auto-detected by Hibernate 6 (Spring Boot 3.x). MySQL8Dialect no longer exists.

spring.security.user.name=admin
spring.security.user.password=123

